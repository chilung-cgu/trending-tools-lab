<h1>context-mode 實驗證據</h1>
<p>這是用真實 context-mode 1.0.169 MCP 伺服器索引合成 BitBake log 的原始紀錄。log 是合成的，不含真實資料。</p>
<ul>
<li><a href="benchmark.json">benchmark.json</a>：完整 log 與檢索輸出的 UTF-8 bytes 與字元數。這是 bytes，不是 token。</li>
<li><a href="mcp_receipts.json">mcp_receipts.json</a>：每個 MCP 請求與回應的原始收據。</li>
</ul>
<p>檔案內的 <code>/home/ubuntu/…</code> 路徑是示範當時的本機位置，與你的環境無關。教學與重跑方式見 <a href="../../docs/context-mode.html">context-mode 教學</a>。</p>
