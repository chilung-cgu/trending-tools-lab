<h1>Worktrunk 實驗證據</h1>
<p>用 Worktrunk 0.80.0 建立獨立 worktree，在其中新增一個檔案，並逐一檢查同一個 repo 的其他 worktree 都沒有出現它。</p>
<ul>
<li><a href="isolation_evidence.txt">isolation_evidence.txt</a>：隔離檢查的結論。</li>
<li><a href="worktrunk_demo.log">worktrunk_demo.log</a>：示範腳本的完整輸出。</li>
</ul>
<p>檔案內的 <code>/home/ubuntu/…</code> 路徑是示範當時的本機位置。worktree 隔離的是檔案與分支，不隔離網路、credentials 或共用的 Git 物件資料庫。完整教學見 <a href="../../docs/worktrunk.html">Worktrunk 教學</a>。</p>
