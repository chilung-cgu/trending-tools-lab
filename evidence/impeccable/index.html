<h1>Impeccable 實驗證據</h1>
<p>榜單探索器的設計檢查紀錄。偵測器保留了一項「暖紙色」警告，這是刻意的設計選擇，不是被忽略。</p>
<ul>
<li><a href="review.md">review.md</a>：實際執行的命令、偵測結果、人工檢視與限制。</li>
<li><a href="detect.json">detect.json</a>：偵測器的原始輸出。</li>
<li><a href="concept-seed.txt">concept-seed.txt</a>：方向抽籤的原始輸出。</li>
<li><a href="worker.config.js">worker.config.js</a>：教學使用的 Playwright 設定。</li>
</ul>
<p>檔案內的 <code>/home/ubuntu/…</code> 路徑是檢查當時的本機位置。完整教學見 <a href="../../docs/impeccable.html">Impeccable 教學</a>。</p>
