name: Deploy to GitHub Pages

# 只在 main 更新時部署；網站內容只來自 git 追蹤的檔案，
# 所以被 .gitignore 排除的 .sandbox、.venv、node_modules、vendor 不可能被發布。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble the site from tracked files only
        run: |
          set -eu
          mkdir _site
          git ls-files -z | xargs -0 -I{} cp --parents {} _site/
          # 開發與測試用的檔案不屬於網站
          for dropped in tests scripts openrig/package.json openrig/package-lock.json package.json package-lock.json pyproject.toml uv.lock playwright.config.js; do
            rm -rf "_site/$dropped"
          done
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/artifacts/openrig/index.html
          test -f _site/openrig/rigs/trending-desk/seats/lead/.openrig/stub/script.json
          du -sh _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
